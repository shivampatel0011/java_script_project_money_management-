<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FinFlow - Smart Finance Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <h2>💰 FinFlow</h2>
      <nav>
        <a href="#" class="nav-link active" data-page="dashboard">Dashboard</a>
        <a href="#" class="nav-link" data-page="transactions">Transactions</a>
        <a href="#" class="nav-link" data-page="reports">Reports</a>
        <a href="#" class="nav-link" data-page="budget">Budget</a>
        <a href="#" class="nav-link" data-page="farm">Farm Expenses</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header>
        <h1 id="page-title">Dashboard</h1>
        <button id="add-btn" class="add-btn">+ Naya Transaction</button>
      </header>

      <!-- Dashboard Content -->
      <div id="dashboard-page">
        <div class="summary-cards">
          <div class="card">
            <p>Total Balance</p>
            <h2 id="total-balance">₹ 0</h2>
          </div>
          <div class="card">
            <p>Income</p>
            <h2 id="total-income" class="income">₹ 0</h2>
          </div>
          <div class="card">
            <p>Expense</p>
            <h2 id="total-expense" class="expense">₹ 0</h2>
          </div>
        </div>

        <div class="charts">
          <div class="chart-box">
            <h3>Monthly Trend</h3>
            <canvas id="barChart" height="200"></canvas>
          </div>
          <div class="chart-box">
            <h3>Expense by Category</h3>
            <canvas id="pieChart" height="200"></canvas>
          </div>
        </div>

        <div class="recent-transactions">
          <h3>Recent Transactions</h3>
          <table id="recent-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="recent-body"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Transaction Modal -->
  <div id="transaction-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">Naya Transaction Add Kare</h2>
      
      <form id="transaction-form">
        <div class="form-group">
          <label>Type</label>
          <div class="toggle">
            <button type="button" id="income-btn" class="toggle-btn active">Income</button>
            <button type="button" id="expense-btn" class="toggle-btn">Expense</button>
          </div>
        </div>

        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="amount" required min="1" />
        </div>

        <div class="form-group">
          <label>Description</label>
          <input type="text" id="description" placeholder="Jaise: Seeds kharide" required />
        </div>

        <div class="form-group">
          <label>Category</label>
          <select id="category" required>
            <option value="">Select Category</option>
            <option value="Farming">Farming</option>
            <option value="Seeds">Seeds</option>
            <option value="Fertilizer">Fertilizer</option>
            <option value="Labour">Labour</option>
            <option value="Salary">Salary</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="date" required />
        </div>

        <div class="modal-buttons">
          <button type="button" id="cancel-btn" class="cancel-btn">Cancel</button>
          <button type="submit" class="submit-btn">Save Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script/app.js"></script>
</body>
</html>
